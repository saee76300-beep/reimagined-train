<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code Buddy: Intro to Coding</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f7a6d">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f4;--ink:#1d2a2e;--mute:#5d6b70;--card:#fff;--line:#d5dbd8;--accent:#1f7a6d;--accent-ink:#fff;--warn:#a4441c;--ok:#1f7a3d;--code:#eef1ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a1c;--ink:#e6ecea;--mute:#9aabaf;--card:#1a2427;--line:#2c3a3e;--accent:#4fc1ae;--accent-ink:#0b1a17;--warn:#f0906a;--ok:#6fd08c;--code:#0f1719}}
:root[data-theme="dark"]{--bg:#121a1c;--ink:#e6ecea;--mute:#9aabaf;--card:#1a2427;--line:#2c3a3e;--accent:#4fc1ae;--accent-ink:#0b1a17;--warn:#f0906a;--ok:#6fd08c;--code:#0f1719}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.7rem;margin:8px 0 4px;letter-spacing:-.02em}
h2{font-size:1.3rem;margin:0 0 8px}
.sub{color:var(--mute);margin:0 0 16px}
.safe{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:10px 12px;font-size:.88rem;color:var(--mute);margin-bottom:16px}
.safe b{color:var(--ink)}
.steps{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.steps button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.steps button[aria-current="step"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps button.done:not([aria-current]){border-color:var(--ok);color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
pre{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:12px;margin:10px 0;overflow-x:auto;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace}
.q{font-weight:600;margin:0 0 8px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.opt.right{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--warn);color:var(--warn)}
#fb{min-height:1.4em;margin-top:6px;font-size:.92rem}
.nav{display:flex;justify-content:space-between;gap:10px;margin-bottom:18px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
summary{cursor:pointer;font-weight:600}
textarea{width:100%;min-height:90px;margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
#msg{color:var(--warn);font-size:.9rem;min-height:1.2em}
#out{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:8px;display:none;background:var(--code);border-radius:6px;padding:12px}
.report{margin-top:8px}
</style>
</head>
<body>
<main>
<h1>Code Buddy</h1>
<p class="sub">Five short lessons to learn the basics of coding. No experience needed.</p>
<div class="safe"><b>Safe to use.</b> Nothing here runs code on your device, and you never need an account or password. Don't paste secrets into the help box.</div>
<div class="steps" id="steps" role="group" aria-label="Lessons"></div>
<section class="card" id="lesson"></section>
<div class="nav"><button class="btn ghost" id="prev">Back</button><button class="btn" id="next">Next lesson</button></div>
<details class="card">
<summary>Stuck? Ask Code Buddy</summary>
<textarea id="in" maxlength="2000" spellcheck="false" placeholder="Ask about this lesson, or paste a few lines of code" aria-label="Your question"></textarea>
<button class="btn" id="ask">Ask</button>
<div id="msg" role="status"></div>
<div id="out" aria-live="polite"></div>
<div class="report" id="reportWrap" style="display:none"><button class="btn ghost small" id="report">Report this answer</button></div>
</details>
</main>
<script>
// ===== SET THIS to your own server URL before building the app (see README.md) =====
const AI_ENDPOINT = "https://YOUR-SERVER-URL/ask";
// =====================================================================================

const L=[
{t:"What is code?",b:"Code is a list of instructions a computer follows, one line at a time, from top to bottom. We use a language called Python because it reads almost like English.",c:'print("Hello, world!")\nprint("I am learning to code")',n:"print shows text on the screen. Each line runs in order, so this shows two messages.",q:"What does print do?",o:["Shows text on the screen","Deletes a file","Saves your work"],a:0},
{t:"Variables",b:"A variable is a labeled box that holds a value. You can put something in the box, look at it, or change it later.",c:'name = "Sam"\nscore = 5\nscore = score + 1\nprint(name, score)',n:"The last line shows: Sam 6. The score box started at 5, then we added 1.",q:"If score = 5 and then score = score + 1, what is score?",o:["5","6","51"],a:1},
{t:"Making decisions",b:"An if statement lets code choose. It only runs its instructions when something is true. else covers everything else.",c:'age = 15\nif age >= 13:\n    print("Teen")\nelse:\n    print("Kid")',n:"The indented lines belong to the if or else above them. Here it shows Teen.",q:"If temp = 30 and the code says: if temp > 25: print(\"Hot\"), what shows?",o:["Hot","Nothing","Error"],a:0},
{t:"Loops",b:"A loop repeats instructions so you don't have to write them again and again.",c:'for i in range(3):\n    print("Hi", i)',n:"This shows Hi 0, Hi 1, Hi 2. Computers usually count from 0.",q:"How many times does for i in range(3) repeat?",o:["2","3","4"],a:1},
{t:"Functions",b:"A function is a named set of instructions you can reuse. You write it once, then use it whenever you like.",c:'def greet(name):\n    print("Hi", name)\n\ngreet("Ana")\ngreet("Ben")',n:"def creates the function. The last two lines use it, showing Hi Ana and Hi Ben.",q:"What is a function?",o:["A bug in your code","A reusable set of instructions","A type of number"],a:1}];
const KEY="codebuddy-done";let cur=0,done=[],lastAnswer="";
try{done=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){done=[]}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}
function el(tag,props,kids){const e=document.createElement(tag);Object.assign(e,props||{});(kids||[]).forEach(k=>e.append(k));return e}
function render(){
const s=$("steps");s.textContent="";
L.forEach((x,i)=>{const b=el("button",{textContent:String(i+1),title:x.t});b.setAttribute("aria-label","Lesson "+(i+1)+": "+x.t+(done.includes(i)?" (done)":""));if(i===cur)b.setAttribute("aria-current","step");if(done.includes(i))b.className="done";b.onclick=()=>{cur=i;render()};s.append(b)});
const x=L[cur],c=$("lesson");c.textContent="";
const fb=el("div",{id:"fb"});fb.setAttribute("aria-live","polite");
c.append(el("h2",{textContent:cur+1+". "+x.t}),el("p",{textContent:x.b}),el("pre",{textContent:x.c}),el("p",{textContent:x.n}),el("p",{className:"q",textContent:"Check yourself: "+x.q}));
x.o.forEach((t,i)=>{const b=el("button",{className:"opt",textContent:t});b.onclick=()=>{
if(i===x.a){b.className="opt right";fb.textContent="Correct! Nice work.";fb.style.color="var(--ok)";if(!done.includes(cur)){done.push(cur);save();render2()}}
else{b.className="opt wrong";fb.textContent="Not quite. Read the example again and try another answer.";fb.style.color="var(--warn)"}};c.append(b)});
c.append(fb);
$("prev").disabled=cur===0;$("next").disabled=cur===L.length-1;
}
function render2(){document.querySelectorAll("#steps button").forEach((b,i)=>{if(done.includes(i))b.classList.add("done")})}
$("prev").onclick=()=>{if(cur>0){cur--;render()}};
$("next").onclick=()=>{if(cur<L.length-1){cur++;render()}};

const SECRET=/(sk-[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|(password|passwd|secret|api[_-]?key|token)\s*[:=]\s*\S{6,})/i;
let busy=false;
$("ask").onclick=async()=>{
if(busy)return;const t=$("in").value.trim(),m=$("msg"),o=$("out");m.textContent="";$("reportWrap").style.display="none";
if(!t){m.textContent="Type a question first.";return}
if(SECRET.test(t)){m.textContent="That looks like it has a password, key or token. Remove it and try again.";return}
if(AI_ENDPOINT.includes("YOUR-SERVER-URL")){m.textContent="AI help isn't set up yet in this build.";return}
busy=true;$("ask").disabled=true;o.style.display="block";o.textContent="Thinking...";
try{
const res=await fetch(AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:t,lesson:L[cur].t})});
if(!res.ok) throw new Error("bad_status");
const data=await res.json();
lastAnswer=data.answer||"";
o.textContent=lastAnswer||"No answer received.";
$("reportWrap").style.display="block";
}catch(e){
o.style.display="none";
m.textContent="Couldn't reach Code Buddy's helper right now. Try again in a moment.";
}
finally{busy=false;$("ask").disabled=false}};

$("report").onclick=()=>{
$("msg").style.color="var(--ok)";
$("msg").textContent="Thanks — this answer has been flagged for review.";
// TODO: send {question, answer, lesson} to your own logging endpoint if you want to review reports.
};

render();
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
</html>
